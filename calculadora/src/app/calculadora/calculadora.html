<div class="calculadora">
  <h1>Calculadora</h1>

  <div class="entrada">
    <label for="valor-a">Valor A</label>
    <input id="valor-a" type="number" [value]="a" (input)="actualizarA($event)" />
  </div>

  <div class="entrada">
    <label for="valor-b">Valor B</label>
    <input id="valor-b" type="number" [value]="b" (input)="actualizarB($event)" />
  </div>

  <div class="botones">
    <button type="button" (click)="calcular('sumar')">Sumar</button>
    <button type="button" (click)="calcular('restar')">Restar</button>
    <button type="button" (click)="calcular('multiplicar')">Multiplicar</button>
    <button type="button" (click)="calcular('dividir')">Dividir</button>
    <button type="button" class="limpiar" (click)="limpiar()">Limpiar</button>
  </div>

  <p class="resultado">Resultado: {{ resultado }}</p>
</div>
